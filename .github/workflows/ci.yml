name: ci

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck
      - name: Shellcheck
        run: shellcheck -S warning -x install.sh test.sh evals/run.sh evals/checks/*.sh .claude/hooks/*.sh
      - name: Self-test
        run: ./test.sh -v

  eval-harness:
    # Proves every eval check can pass, against a known-good solution. No API spend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Reference run
        run: |
          git config --global user.email ci@local
          git config --global user.name ci
          bash evals/run.sh --reference
